# Kotlin
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true -Djdk.net.unixdomain.tmpdir=C:/tmp

# Android
android.useAndroidX=true
android.enableJetifier=false

# Kotlin / Compose
kotlin.code.style=official
android.nonFinalResIds=false
android.nonTransitiveRClass=true

# Build Performance — PRD mandates parallel=false (KSP stability)
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=true

# 2026 Incremental Compiler Speedups
ksp.incremental=true
ksp.incremental.intermodule=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
