[versions]
kotlin               = "2.1.21"
agp                  = "8.9.1"
ksp                  = "2.1.21-2.0.1"
composeBom           = "2025.06.01"
material3Adaptive    = "1.1.0"
hilt                 = "2.55"
room                 = "2.7.1"
navigation           = "2.9.0"
workManager          = "2.10.0"
dataStore            = "1.1.2"
lifecycle            = "2.8.7"
coroutines           = "1.9.0"
kotlinxSerialization = "1.8.0"
coil                 = "3.1.0"
admob                = "23.5.0"
ump                  = "3.1.0"
billing              = "7.1.1"
timber               = "5.0.1"
turbine              = "1.2.0"
googleServices       = "4.4.2"
firebaseBom          = "33.9.0"
crashlyticsPlugin    = "3.0.3"
firebasePerfPlugin   = "2.0.2"
baselineProfilePlugin = "1.3.1"
activityCompose      = "1.9.3"
splashscreen         = "1.0.1"
glance               = "1.1.1"
playReview           = "2.0.2"
playAppUpdate        = "2.1.0"
leakCanary           = "2.14"
profileInstaller     = "1.4.1"

[libraries]
# Compose
compose-bom                 = { group = "androidx.compose",              name = "compose-bom",                version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",           name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",           name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",           name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3",    name = "material3" }
compose-material3-adaptive  = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity            = { group = "androidx.activity",             name = "activity-compose",           version.ref = "activityCompose" }

# Hilt
hilt-android                = { group = "com.google.dagger",             name = "hilt-android",               version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",             name = "hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",                 name = "hilt-navigation-compose",    version = "1.2.0" }
hilt-work                   = { group = "androidx.hilt",                 name = "hilt-work",                  version = "1.2.0" }
androidx-hilt-compiler      = { group = "androidx.hilt",                 name = "hilt-compiler",              version = "1.2.0" }

# Room
room-runtime                = { group = "androidx.room",                 name = "room-runtime",               version.ref = "room" }
room-ktx                    = { group = "androidx.room",                 name = "room-ktx",                   version.ref = "room" }
room-compiler               = { group = "androidx.room",                 name = "room-compiler",              version.ref = "room" }

# Navigation + Serialization
navigation-compose          = { group = "androidx.navigation",           name = "navigation-compose",         version.ref = "navigation" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Background work + Storage
workmanager                 = { group = "androidx.work",                 name = "work-runtime-ktx",           version.ref = "workManager" }
datastore-preferences       = { group = "androidx.datastore",           name = "datastore-preferences",      version.ref = "dataStore" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",            name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",            name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
lifecycle-process           = { group = "androidx.lifecycle",            name = "lifecycle-process",          version.ref = "lifecycle" }

# SplashScreen
splashscreen-core           = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Glance (home screen widget)
glance-appwidget            = { group = "androidx.glance", name = "glance-appwidget",  version.ref = "glance" }
glance-material3            = { group = "androidx.glance", name = "glance-material3",  version.ref = "glance" }

# Coil 3
coil-compose                = { group = "io.coil-kt.coil3",              name = "coil-compose",               version.ref = "coil" }

# Ads + Billing
admob                       = { group = "com.google.android.gms",       name = "play-services-ads",          version.ref = "admob" }
ump                         = { group = "com.google.android.ump",       name = "user-messaging-platform",    version.ref = "ump" }
billing                     = { group = "com.android.billingclient",     name = "billing-ktx",                version.ref = "billing" }

# Firebase
firebase-bom                = { group = "com.google.firebase",           name = "firebase-bom",               version.ref = "firebaseBom" }
firebase-crashlytics        = { group = "com.google.firebase",           name = "firebase-crashlytics" }
firebase-analytics          = { group = "com.google.firebase",           name = "firebase-analytics" }
firebase-perf               = { group = "com.google.firebase",           name = "firebase-perf" }

# Play Store Utilities
play-review                 = { group = "com.google.android.play",       name = "review-ktx",                 version.ref = "playReview" }
play-app-update             = { group = "com.google.android.play",       name = "app-update-ktx",             version.ref = "playAppUpdate" }

# Expertise: Stability & Performance
leakcanary                  = { group = "com.squareup.leakcanary",       name = "leakcanary-android",         version.ref = "leakCanary" }
profileinstaller            = { group = "androidx.profileinstaller",     name = "profileinstaller",           version.ref = "profileInstaller" }

# Utility
timber                      = { group = "com.jakewharton.timber",        name = "timber",                     version.ref = "timber" }
turbine                     = { group = "app.cash.turbine",              name = "turbine",                    version.ref = "turbine" }

# Test
junit                       = { group = "junit",                         name = "junit",                      version = "4.13.2" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
hilt-android         = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics",           version.ref = "crashlyticsPlugin" }
firebase-perf        = { id = "com.google.firebase.firebase-perf",         version.ref = "firebasePerfPlugin" }
baselineprofile      = { id = "androidx.baselineprofile",                version.ref = "baselineProfilePlugin" }
